name: rnndet

rvt_block:
  name: MaxViTRNN
  use_image_branch: true
  dual_frequency_fusion: mean
  input_channels: 20
  enable_masking: false
  partition_split_32: 1
  in_res_hw: ???
  embed_dim: 64
  dim_multiplier: [1, 2, 4, 8]
  num_blocks: [1, 1, 1, 1]
  T_max_chrono_init: [4, 8, 16, 32]
  stem:
    patch_size: 4
  stage:
    downsample:
      type: patch
      overlap: true
      norm_affine: true
    attention:
      use_torch_mha: false
      partition_size: ???
      dim_head: 32
      attention_bias: true
      mlp_activation: gelu
      mlp_gated: false
      mlp_bias: true
      mlp_ratio: 4
      drop_mlp: 0
      drop_path: 0
      ls_init_value: 1.0e-5
    lstm:
      dws_conv: false
      dws_conv_only_hidden: true
      dws_conv_kernel_size: 3
      drop_cell_update: 0

rgb_backbone:
  input_format: rgb
  load_pretrained_weights: false
  MODEL:
    PIXEL_MEAN: [123.675, 116.280, 103.530]
    PIXEL_STD: [58.395, 57.120, 57.375]
    BACKBONE:
      NAME: build_resnet_fpn_backbone
      FREEZE_AT: 2
    RESNETS:
      OUT_FEATURES: [res2, res3, res4, res5]
      DEPTH: 50
      STRIDE_IN_1X1: false
      NORM: FrozenBN
      STEM_OUT_CHANNELS: 64
      NUM_GROUPS: 1
      WIDTH_PER_GROUP: 64
      RES2_OUT_CHANNELS: 256
      RES5_DILATION: 1
      DEFORM_ON_PER_STAGE: [false, false, false, false]
      DEFORM_MODULATED: false
      DEFORM_NUM_GROUPS: 1
    FPN:
      IN_FEATURES: [res2, res3, res4, res5]
      OUT_CHANNELS: 256
      NORM: ''
      FUSE_TYPE: sum
    ROI_HEADS:
      IN_FEATURES: [p2, p3, p4, p5]
    ROI_BOX_HEAD:
      POOLER_TYPE: ROIAlignV2
      POOLER_RESOLUTION: 7
      POOLER_SAMPLING_RATIO: 2

rvt_fpn:
  name: PAFPN
  position: post_fusion
  depth: 0.67
  in_stages: [2, 3, 4]
  depthwise: false
  act: silu

yolox_head:
  name: YoloX
  num_classes: ???
  ignore_label: null
  depthwise: false
  act: silu

postprocess:
  confidence_threshold: 0.1
  nms_threshold: 0.45
